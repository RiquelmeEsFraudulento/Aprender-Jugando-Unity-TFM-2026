<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="potGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#55ff88"/>
      <stop offset="100%" stop-color="#006622"/>
    </radialGradient>
    <filter id="potShadow" x="-30%" y="-10%" width="160%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#051a05" stroke="#44ff88" stroke-width="2" opacity="0.9"/>
  <!-- Cork -->
  <rect x="25" y="10" width="14" height="8" rx="3" fill="#c8a050" stroke="#8b6914" stroke-width="1" filter="url(#potShadow)"/>
  <!-- Neck -->
  <rect x="27" y="18" width="10" height="6" rx="1" fill="#1a5c2a"/>
  <!-- Body -->
  <path d="M26 24 L22 30 Q14 38 14 46 C14 56, 22 60, 32 60 C42 60, 50 56, 50 46 C50 38, 42 30, 38 24 Z" fill="url(#potGlow)" filter="url(#potShadow)"/>
  <!-- Liquid level -->
  <ellipse cx="32" cy="46" rx="16" ry="6" fill="#33cc66" opacity="0.6"/>
  <!-- Shine -->
  <ellipse cx="26" cy="36" rx="4" ry="7" fill="white" opacity="0.2"/>
  <!-- Bubble -->
  <circle cx="38" cy="40" r="2.5" fill="white" opacity="0.3"/>
  <circle cx="38" cy="40" r="1.2" fill="white" opacity="0.6"/>
</svg>
