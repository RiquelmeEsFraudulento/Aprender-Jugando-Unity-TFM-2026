<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#1a0505" stroke="#ff4444" stroke-width="2" opacity="0.9"/>
  <!-- Dripping blood / life steal drop -->
  <path d="M32 12 C32 12, 20 30, 20 40 C20 48, 25 54, 32 54 C39 54, 44 48, 44 40 C44 30, 32 12, 32 12Z" fill="url(#glow)" filter="url(#shadow)"/>
  <!-- Highlight shine -->
  <ellipse cx="28" cy="34" rx="5" ry="8" fill="white" opacity="0.25"/>
  <!-- Small droplet -->
  <circle cx="42" cy="16" r="4" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="42" cy="16" r="2" fill="white" opacity="0.4"/>
</svg>
