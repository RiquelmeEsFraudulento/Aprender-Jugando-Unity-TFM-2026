<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="chaosGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd44"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </radialGradient>
    <filter id="chaosShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#1a1000" stroke="#ffaa00" stroke-width="2" opacity="0.9"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffcc44" stroke-width="1.5" opacity="0.6"/>
  <!-- Yin-yang base -->
  <path d="M32 10 A22 22 0 0 0 32 54 A11 11 0 0 1 32 32 A11 11 0 0 0 32 10Z" fill="#1a1a2e" filter="url(#chaosShadow)"/>
  <path d="M32 10 A22 22 0 0 1 32 54 A11 11 0 0 0 32 32 A11 11 0 0 1 32 10Z" fill="url(#chaosGlow)" filter="url(#chaosShadow)"/>
  <!-- Dark dot (light pupil) -->
  <circle cx="32" cy="21" r="5" fill="#1a1a2e"/>
  <!-- Light dot (dark pupil) -->
  <circle cx="32" cy="43" r="5" fill="url(#chaosGlow)"/>
  <!-- Chaos sparks -->
  <line x1="48" y1="14" x2="52" y2="10" stroke="#ffaa00" stroke-width="2" opacity="0.8"/>
  <line x1="12" y1="50" x2="8" y2="54" stroke="#ffaa00" stroke-width="2" opacity="0.8"/>
  <line x1="52" y1="42" x2="56" y2="44" stroke="#ffdd44" stroke-width="1.5" opacity="0.6"/>
  <!-- Center highlight -->
  <circle cx="32" cy="32" r="3" fill="white" opacity="0.15"/>
</svg>
