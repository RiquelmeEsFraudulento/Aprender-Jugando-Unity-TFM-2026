<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88ccff"/>
      <stop offset="100%" stop-color="#1040a0"/>
    </linearGradient>
    <filter id="stoneShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#050a1a" stroke="#6699ff" stroke-width="2" opacity="0.9"/>
  <!-- Gem top facet -->
  <polygon points="20,16 44,16 52,28 12,28" fill="url(#stoneGrad)" filter="url(#stoneShadow)"/>
  <!-- Gem bottom point -->
  <polygon points="12,28 52,28 32,56" fill="url(#stoneGrad)" filter="url(#stoneShadow)"/>
  <!-- Left inner shadow -->
  <polygon points="12,28 32,28 32,56" fill="black" opacity="0.15"/>
  <!-- Top shine -->
  <polygon points="24,16 40,16 46,24 18,24" fill="white" opacity="0.3"/>
  <!-- Sparkle -->
  <line x1="24" y1="20" x2="28" y2="20" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="26" y1="18" x2="26" y2="22" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner glow -->
  <ellipse cx="32" cy="38" rx="8" ry="4" fill="white" opacity="0.08"/>
</svg>
